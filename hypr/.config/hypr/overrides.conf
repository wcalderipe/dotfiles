# Unbind Omarchy defaults
unbind = $mainMod SHIFT, E  # HEY webapp

# Move active workspace between monitors
bindd = SUPER CTRL, UP,   Move workspace to monitor up,   movecurrentworkspacetomonitor, u
bindd = SUPER CTRL, DOWN, Move workspace to monitor down, movecurrentworkspacetomonitor, d

# Scriba floating window
windowrule = float on, match:class org.omarchy.scriba
windowrule = center on, match:class org.omarchy.scriba
windowrule = size 550 350, match:class org.omarchy.scriba

# Grace-period suspend on lid close (see scripts/grace-suspend.sh).
# Additive to omarchy's lid bindings: omarchy handles the internal display,
# these handle the delayed suspend so docking within the window stays warm.
# Needs logind HandleLidSwitch=ignore (scripts/config/framework-13.sh).
bindl = , switch:on:Lid Switch,  exec, ~/.config/hypr/scripts/grace-suspend.sh arm
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/grace-suspend.sh disarm

# Disable the laptop panel when docking with the lid already closed (no lid
# event fires in that case, so omarchy's lid handler never runs). Complements
# omarchy-hyprland-monitor-watch, which only handles monitor removal.
exec-once = uwsm-app -- ~/.config/hypr/scripts/dock-internal-off.sh
